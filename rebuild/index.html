<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>磚2 · 全新版本</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#171a20;background:#15171b}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center}.phone{width:min(100%,440px);height:min(94dvh,890px);background:#fafafa;border:9px solid #25272b;border-radius:42px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 15px 60px #0007}.status{height:52px;flex-shrink:0;padding:20px 28px 0;font-size:14px;font-weight:700;display:flex;justify-content:space-between}.top{padding:12px 20px 16px;display:flex;align-items:center;justify-content:space-between}.top h1{font-size:23px;margin:0}.top button,.tabs button,.back,.actions button{border:0;background:transparent;font:inherit;cursor:pointer}.sub{font-size:12px;color:#89909a}.tabs{display:flex;gap:10px;padding:0 20px 14px}.tabs button{background:#eee;border-radius:30px;padding:9px 17px}.tabs .on{background:#151515;color:white}.scroll{overflow:auto;flex:1;min-height:0}.thread{display:flex;align-items:center;gap:12px;width:100%;padding:13px 20px;border:0;background:white;text-align:left;cursor:pointer}.thread+.thread{border-top:1px solid #f4f4f4}.avatar{width:47px;height:47px;border-radius:17px;background:#c4d1d6;display:grid;place-items:center;flex-shrink:0;font-weight:700;font-size:19px;color:#fff}.thread .content{flex:1;min-width:0}.thread b{font-size:16px}.thread small{display:block;color:#9298a0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:5px}.meta{font-size:12px;color:#969ca5;text-align:right}.dot{display:inline-grid;place-items:center;border-radius:50%;background:#f05c3e;color:white;min-width:20px;height:20px;margin-top:6px}.chatHead{display:flex;gap:14px;align-items:center;padding:10px 17px 16px;background:#d6e3ef}.chatHead h2{font-size:18px;margin:0}.chat{background:#d6e3ef;padding:16px;display:flex;flex-direction:column;gap:13px}.bubble{max-width:83%;padding:12px 15px;border-radius:16px;background:white;line-height:1.55;font-size:15px;align-self:flex-start;white-space:pre-wrap}.bubble.me{background:#ffe257;align-self:flex-end}.bubble small{display:block;color:#777;font-size:10px;margin-top:5px}.choices{padding:12px;display:grid;gap:7px;background:#e5edf5}.choices button{border:0;border-radius:13px;background:#fff8d7;text-align:left;padding:12px 14px;font:inherit;cursor:pointer}.choices button:disabled{opacity:.5}.foot{height:46px;background:#f5f5f5;display:flex;justify-content:center;align-items:center;gap:12px}.foot button{border:0;background:none;cursor:pointer}.notice{font-size:12px;color:#66717d;padding:8px 18px}.home{height:5px;width:100px;background:#272727;border-radius:5px;margin:12px auto 8px;flex-shrink:0}.empty{padding:20px;color:#778}.reset{color:#b33}.day{font-size:12px;color:#61788e;text-align:center;margin:5px}
</style></head><body><main class="phone"><div class="status"><span id="clock">10:00</span><span>●●●  ▰  94%</span></div><div id="app" style="display:flex;flex:1;min-height:0;flex-direction:column"></div><div class="home"></div></main><script>
"use strict";
const KEY="zhuan2-rebuild-v1";
const people=[
["沈硯舟","沈","活動認識的大學生",10],
["裴知聿","裴","希望重新聯繫的前男友",70],
["祁野","祁","偶然認識的祁家次子",0],
["林安","林","朋友",0],["周予晴","周","朋友",0],["陳以衡","陳","朋友",0],["許棠","許","朋友",0],["顧時安","顧","建築設計師",0],["下班後五人組","群","朋友群組",0]];
const scenes={
"林安":[["欸，妳今天幾點下班？","剛下班，怎麼了？","還在忙，晚點說。","妳要約什麼？","今天不太想出門。"],["我想問週五要不要一起吃飯，大家最近都忙得沒見到面。","好啊，先算我。","我還不確定能不能去。","在哪裡吃？","這次先不去了。"],["好，我先去問其他人時間。確定再跟妳說。","好，謝啦。","不要訂太晚。","有消息再告訴我。","我先忙工作。"]],
"周予晴":[["我剛看到週末有個小市集，攤位還滿有趣的。","在哪裡？","妳想去嗎？","我週末可能沒空。","傳資訊給我看看。"],["我先把活動資訊整理好再傳妳，不急。","好，等妳。","妳最近工作還好嗎？","可以順便找林安。","那我晚點看。"]],
"陳以衡":[["這週餐廳忙著試新菜，剛忙完一輪。","辛苦了。","試了什麼菜？","週五聚餐你會去嗎？","你先休息。"],["還在調整口味，等穩定了再找你們來試。","好啊。","別把自己累壞。","我很期待。","那先不吵你。"]],
"許棠":[["今天班表終於排出來了，我先去補眠。","辛苦啦。","這週有休假嗎？","好，晚點聊。","記得吃飯。"],["謝啦，等我睡醒再回妳。","好。","晚安。","有空再說。","不用急著回。"]],
"沈硯舟":[["嗨，我是上次活動拿相機的沈硯舟。突然傳訊息會不會打擾妳？","記得你，怎麼了？","你怎麼有我的聯絡方式？","現在有點忙，晚點聊。","不會，有什麼事嗎？"],["我在整理那天的照片，有一張妳剛好入鏡。想先問妳介不介意我傳給妳看。","可以，傳給我看看。","你拍到哪一張？","先不用，謝謝。","你平常也常拍照嗎？"],["好，我會先確認照片，不會擅自公開。這週還有報告要交，整理完再傳妳。","沒關係，不急。","謝謝你先問。","報告加油。","那你先忙。"]],
"裴知聿":[["很久沒聯絡了。這樣突然傳訊息，應該有點冒昧。","你找我有什麼事？","我們不是說好先不要聯絡？","我最近還好，你呢？","我現在不想聊。"],["整理舊東西時翻到以前的照片。我知道這不是打擾妳的理由，只是想問問妳最近過得好不好。","我還好。","你是想談以前的事？","我不想回頭談這些。","你最近在忙什麼？"],["我知道。妳不需要現在回答，也不用因為過去的關係給我機會。","我知道了。","謝謝你尊重我。","我們之後再談。","先這樣吧。"]],
"祁野":[["欸，上次停車場那件事，妳還記得嗎？","你是哪位？","記得，你車擋到我了。","你想說什麼？","現在沒空。"],["祁野。那天確實是我的車擋到妳。這事我不對，跟妳道個歉。","好，我接受道歉。","你現在才想起來？","你怎麼找到我的？","以後注意就好。"],["行，話說清楚了。下次我會注意，別再讓妳遇到這種事。","知道了。","希望如此。","那就這樣。","你平常都這麼直接？"]],
"顧時安":[["今天去現場看了一下細節，發現一個滿有意思的空間配置。","哪裡有意思？","你今天又跑現場？","辛苦了。","我現在有點忙。"],["主要是採光跟動線的關係。我回去想把它畫進模型裡，還得再試幾版。","聽起來不錯。","你慢慢弄。","有成果再分享。","別太晚休息。"]],
"下班後五人組":[["林安：週五晚上大家有空嗎？想約個飯。","我應該可以。","我還不確定。","你們想吃什麼？","這週我先不參加。"],["陳以衡：我先看看店裡排班，確定再說。","好，等大家確認。","不用急。","先選餐廳吧。","我先忙了。"]]
};
let state;try{state=JSON.parse(localStorage.getItem(KEY)||"null")}catch{}
function fresh(){return {day:1,minute:600,active:"",messages:{},steps:{},unread:{},affinity:Object.fromEntries(people.map(p=>[p[0],p[3]])),scheduled:[],seen:{}}}
if(!state||!state.messages||!state.steps)state=fresh();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
function clock(){let m=state.minute;return String(Math.floor(m/60)%24).padStart(2,"0")+":"+String(m%60).padStart(2,"0")}
function deliver(name,text){(state.messages[name]??=[]).push({text,me:false,day:state.day,time:clock()});if(state.active!==name)state.unread[name]=(state.unread[name]||0)+1}
function schedule(name,text,delay){state.scheduled.push({name,text,at:state.day*1440+state.minute+delay})}
function advance(minutes=1){state.minute+=minutes;while(state.minute>=1440){state.minute-=1440;state.day++}let now=state.day*1440+state.minute;const ready=state.scheduled.filter(x=>x.at<=now);state.scheduled=state.scheduled.filter(x=>x.at>now);ready.sort((a,b)=>a.at-b.at).forEach(x=>deliver(x.name,x.text));save();render()}
function start(){if(state.seen.started)return;state.seen.started=true;schedule("林安",scenes["林安"][0][0],1);schedule("周予晴",scenes["周予晴"][0][0],4);schedule("沈硯舟",scenes["沈硯舟"][0][0],8);schedule("下班後五人組",scenes["下班後五人組"][0][0],12);schedule("裴知聿",scenes["裴知聿"][0][0],19);schedule("祁野",scenes["祁野"][0][0],26);schedule("顧時安",scenes["顧時安"][0][0],32);schedule("陳以衡",scenes["陳以衡"][0][0],38);schedule("許棠",scenes["許棠"][0][0],43);save()}
function openChat(name){state.active=name;state.unread[name]=0;save();render();setTimeout(()=>document.querySelector(".scroll")?.scrollTo(0,999999),0)}
function respond(index){const name=state.active,step=state.steps[name]||0,scene=scenes[name];if(!scene||step>=scene.length)return;const options=scene[step].slice(1),reply=options[index];if(!reply)return;(state.messages[name]??=[]).push({text:reply,me:true,day:state.day,time:clock()});state.steps[name]=step+1;state.affinity[name]=(state.affinity[name]||0)+(index===0?2:index===3?-1:0);if(step+1<scene.length)schedule(name,scene[step+1][0],2+index*2);save();render()}
function customReply(){const field=document.querySelector("#draft"),value=field?.value.trim(),name=state.active;if(!value)return;(state.messages[name]??=[]).push({text:value,me:true,day:state.day,time:clock()});if(!state.seen["free-"+name]){state.seen["free-"+name]=true;schedule(name,"我看到了，讓我想一下怎麼回妳。",3)}else schedule(name,"我有看到妳說的。這件事我想再想想，晚點回妳。",4);save();render()}
function render(){document.querySelector("#clock").textContent=clock();const app=document.querySelector("#app"),name=state.active;if(!name){const sorted=[...people].sort((a,b)=>{const x=state.messages[a[0]]?.at(-1),y=state.messages[b[0]]?.at(-1);return (y?.day*1440+Number(y?.time?.slice(0,2))*60+Number(y?.time?.slice(3))||0)-(x?.day*1440+Number(x?.time?.slice(0,2))*60+Number(x?.time?.slice(3))||0)});app.innerHTML='<div class="top"><h1>聊天</h1><span class="sub">第 '+state.day+' 天 · '+clock()+'</span></div><div class="tabs"><button class="on">聊天</button><button onclick="advance(60)">推進 1 小時</button><button onclick="advance(1440)">下一天</button></div><div class="notice">角色會在你沒有打開聊天室時傳訊息。好感度不公開。</div><div class="scroll">'+sorted.map(p=>{const last=state.messages[p[0]]?.at(-1),n=state.unread[p[0]]||0;return '<button class="thread" data-open="'+esc(p[0])+'"><span class="avatar">'+p[1]+'</span><span class="content"><b>'+esc(p[0])+'</b><small>'+esc(last?.text||p[2])+'</small></span><span class="meta">'+(last?.time||'')+(n?'<br><span class="dot">'+n+'</span>':'')+'</span></button>'}).join('')+'</div><div class="foot"><button onclick="advance(1)">時間 +1 分</button><button class="reset" id="reset">重新開始</button></div>';app.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openChat(b.dataset.open));app.querySelector("#reset").onclick=()=>{if(confirm("確定刪除新版遊戲存檔，從第一天重新開始？")){state=fresh();start();render()}}}else{const p=people.find(x=>x[0]===name),msgs=state.messages[name]||[],step=state.steps[name]||0,scene=scenes[name],waiting=state.scheduled.some(x=>x.name===name),canReply=msgs.length>0&&!msgs.at(-1).me&&!waiting&&step<scene.length;app.innerHTML='<div class="chatHead"><button class="back" id="back">←</button><span class="avatar">'+p[1]+'</span><div><h2>'+esc(name)+'</h2><span class="sub">'+esc(p[2])+'</span></div></div><div class="scroll chat">'+(msgs.length?msgs.map(m=>'<div class="bubble '+(m.me?'me':'')+'">'+esc(m.text)+'<small>第 '+m.day+' 天 '+m.time+'</small></div>').join(''):'<p class="empty">目前還沒有訊息。</p>')+(waiting?'<p class="day">'+esc(name)+' 尚未回覆…</p>':'')+'</div>'+(canReply?'<div class="choices">'+scene[step].slice(1).map((o,i)=>'<button data-reply="'+i+'">'+esc(o)+'</button>').join('')+'</div>':'')+'<div class="foot"><input id="draft" aria-label="輸入訊息" placeholder="輸入訊息…" style="flex:1;min-width:0;border:0;border-radius:12px;padding:8px;margin-left:10px"><button id="send">傳送</button><button id="wait">+1 分</button></div>';app.querySelector("#back").onclick=()=>{state.active="";save();render()};app.querySelectorAll("[data-reply]").forEach(b=>b.onclick=()=>respond(Number(b.dataset.reply)));app.querySelector("#send").onclick=customReply;app.querySelector("#draft").onkeydown=e=>{if(e.key==="Enter")customReply()};app.querySelector("#wait").onclick=()=>advance(1);app.querySelector(".scroll").scrollTop=999999}}
start();render();setInterval(()=>advance(1),15000);
</script></body></html>
