name: Shen Batch01 KKT UI verification
on:
  push:
    branches:
      - feature/character-autonomy-v3
    paths:
      - '.github/workflows/shen-batch01-ui.yml'
      - 'tests/brick3-shen-batch01.spec.ts'
      - 'scripts/brick3-shen-batch01.test.mjs'
      - 'scripts/brick3-photo-events.mjs'
      - 'docs/brick3-photo-events-v1.json'
      - 'public/story-photos/shen_yanzhou/**'
      - 'playwright.config.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  photo-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate story graph and photo manifests
        run: |
          npm run story:validate
          npm run story:test
          node --test scripts/brick3-shen-batch01.test.mjs
      - name: Production build
        run: npm run build
      - name: Install Chromium for actual KKT browser test
        run: npx playwright install --with-deps chromium
      - name: Render KKT mobile chat and exercise scripted choice
        run: npx playwright test tests/brick3-shen-batch01.spec.ts
      - name: Archive KKT screenshots and browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shen-batch01-kkt-ui
          path: |
            outputs/brick3-shen-batch01/**
            playwright-report/**
            test-results/**
          if-no-files-found: ignore
          retention-days: 7
