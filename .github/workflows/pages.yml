name: Validate and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run visual-memory:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run story:validate
      - run: npm run story:test
      - run: npm run build
      - name: Add independent 磚2 rebuild preview
        uses: actions/checkout@v4
        with:
          ref: rebuild-zhuan2-v1
          path: rebuild-source
      - name: Publish isolated rebuild under /rebuild/
        run: |
          mkdir -p dist/rebuild
          cp rebuild-source/rebuild/index.html dist/rebuild/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
